function setDay(date){
  const old=state.mobileDay;
  const dir = date>old ? 1 : (date<old ? -1 : 0);   // 1 = adelante (entra desde la derecha), -1 = atrás
  const c=document.getElementById('content');
  const oldHTML = (dir!==0 && c) ? c.innerHTML : '';
  state.mobileDay=date; render(); scrollTop();
  if(dir!==0 && c && c.animate) slideContent(c, oldHTML, dir); else fadeContent();
}
// Transición tipo "tira": el día actual sale a la izquierda mientras el nuevo entra desde la derecha, como un solo bloque.
function slideContent(c, oldHTML, dir){
  c.style.position='relative'; c.style.overflow='hidden';
  const nw=document.createElement('div');                       // contenido NUEVO (queda en el flujo, da la altura)
  while(c.firstChild) nw.appendChild(c.firstChild);
  c.appendChild(nw);
  const ow=document.createElement('div');                       // contenido VIEJO (superpuesto, sale a un lado)
  ow.style.cssText='position:absolute;left:0;right:0;top:0;pointer-events:none';
  ow.innerHTML=oldHTML; c.appendChild(ow);
  const ease='cubic-bezier(.33,0,.2,1)', dur=330;
  nw.animate([{transform:`translateX(${dir*100}%)`},{transform:'none'}], {duration:dur, easing:ease});
  const a=ow.animate([{transform:'none'},{transform:`translateX(${-dir*100}%)`}], {duration:dur, easing:ease, fill:'forwards'});
  let done=false; const cleanup=()=>{ if(done)return; done=true;
    try{a.cancel();}catch(_){}; try{ow.remove();}catch(_){}
    // Solo devolvemos el contenido nuevo al flujo si NADIE re-pintó durante la animación.
    // Si un render() (refreshData, cambio rápido de pestaña, etc.) reemplazó el contenido,
    // `nw` quedó desprendido: reinyectarlo duplicaría la vista. En ese caso lo dejamos como está.
    if(nw.parentNode===c){ while(nw.firstChild) c.appendChild(nw.firstChild); try{nw.remove();}catch(_){} }
    c.style.overflow=''; c.style.position='';   // los estilos SIEMPRE se limpian (render no los toca)
  };
  a.onfinish=cleanup; setTimeout(cleanup, dur+90);
}
function mobileDay(){
  const date=state.mobileDay;const d=dateAt(date,0);
  const faded=!state.fullWeek && state.weekView===0, isToday=date===ymd(NOW), lineHour=NOW.getHours();
  let rows='';
  for(const h of HOURS){
    const sc=slotCat(date,h);
    if(sc.cat==='na') continue;
    if(faded && isToday && h===lineHour) rows+=`<div class="m-now">Ahora · ${hlabel(lineHour)}</div>`;
    const past=dateAt(date,h+1).getTime()<=NOW.getTime();   // ya pasó — difumina en ambas vistas
    const fade=(s)=> past ? s.replace('class="mslot','class="mslot m-faded') : s;
    if(sc.cat==='split'){
      [0,1].forEach(half=>{const s=half?sc.s1:sc.s0;
        if(state.onlyAvailable && !['free','class','open','flex'].includes(s.kind)) return;
        rows+=fade(mHalf(date,h,half,s));});

function mHalf(date,h,half,s){

/* ---- MY RESERVATIONS ---- */
function viewMine(){
  const hs=myHouses();
  // Una clase fija (de la plantilla) NO va en "Próximas reservas": va en "Mis clases semanales".
  const isFixedClass=(r)=>{ if(r.type!=='class') return false; const dw=dateAt(r.date,r.h).getDay(); const sm=r.h*60+(r.min||0);
    return (CLASS_TEMPLATE||[]).some(c=>normHouseKey(c.house)===normHouseKey(r.house) && c.dow===dw && c.startMin===sm); };
  const mine=reservations.filter(r=>r.mine && !isFixedClass(r));   // casa compartida: aquí solo van MIS reservas (las clases fijas van aparte)
  const up=mine.filter(r=>dateAt(r.date,r.h)>=NOW).sort((a,b)=>dateAt(a.date,a.h)-dateAt(b.date,b.h));
  const ws=ymd(OPEN_WEEK_START);
  const past=mine.filter(r=>dateAt(r.date,r.h)<NOW && r.date>=ws && r.date<=OPEN_WEEK_END).sort((a,b)=>dateAt(b.date,b.h)-dateAt(a.date,a.h));
  const DIAS_FULL=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const resRangeTxt=(r)=>{ const eTot=playEndMin(r.date, r.h*60+(r.min||0)+r.dur), eH=Math.floor(eTot/60), eM=eTot%60;
    const ap=x=>x<12?'a.m.':'p.m.', hh=x=>x%12||12, fmt=(H,M)=>hh(H)+':'+String(M).padStart(2,'0');
    return ap(r.h)===ap(eH) ? `${fmt(r.h,r.min||0)} a ${fmt(eH,eM)} ${ap(eH)}` : `${fmt(r.h,r.min||0)} ${ap(r.h)} a ${fmt(eH,eM)} ${ap(eH)}`; };
  const card=(r)=>{
    const d=dateAt(r.date,r.h);const fut=d>=NOW;const cancelable=(d-NOW)>(r.type==='class'?1:0.5)*3600000;
    const dateLine=`${cap1(DIAS_FULL[d.getDay()])} ${d.getDate()} de ${MESES[d.getMonth()]}`;
    let actions='';
    if(fut){
      const cancelBtn = cancelable ? `<button class="mr-cancel" onclick="cancelRes(${r.id})">Cancelar</button>` : `<span class="mr-nocancel">No cancelable</span>`;
      let right='';
      if(r.type==='normal'){
        const m=matchFor(r.id);
        if(m && m.status==='matched'){
          const first=(m.otherName||'—').split(' ')[0];
          right = m.otherPhone
            ? `<a class="mr-matched" href="${waMatchLink(m.otherName,m.otherPhone,DOW[d.getDay()]+' '+d.getDate())}" target="_blank" rel="noopener">Vs. ${first} ${WA_ICON}</a>`
            : `<span class="mr-matched">Vs. ${first}</span>`;
        } else if(m && m.status==='open'){
          right = `<button class="mr-seek searching" onclick="cancelSeekMatch(${m.id})">Buscando con quién jugar</button>`;
        } else {
          right = `<button class="mr-seek" onclick="seekMatch(${r.id})">Buscar con quién jugar</button>`;
        }
      }
      actions = `<div class="mr-actions">${cancelBtn}${right}</div>`;
    }
    return `<div class="mr-item"><div class="mr-row${fut?' tap':''}"${fut?` onclick="openMyRes(${r.id})"`:''}>
      <span class="mr-day">${dateLine}${(FREE_ENABLED && r.type==='normal' && !resPeakMin(r))?' <span class="mr-libre">★ Libre</span>':''}</span><span class="mr-hour">${resRangeTxt(r)}</span>
    </div>${actions}</div>`;};
  let html='';
  // 1) Próximas
  html+=`<div class="mr-title">Próximas</div><div class="panel">${up.length?up.map(card).join(''):emptyInline('No tienes reservas próximas')}</div>`;
  // 2) Anteriores
  html+=`<div class="mr-title" style="margin-top:18px">Anteriores</div><div class="panel past-panel">${past.length?past.map(card).join(''):emptyInline('No tienes reservas anteriores')}</div>`;
  // 2) Mis clases semanales (después), con opción de cancelar la de esta semana.
  const myKeys=new Set(hs.map(normHouseKey));
  const dowOrd=x=>x===0?7:x;
  const myClases=(CLASS_TEMPLATE||[]).filter(c=>c.house && myKeys.has(normHouseKey(c.house))).sort((a,b)=>dowOrd(a.dow)-dowOrd(b.dow)||a.startMin-b.startMin);
  if(myClases.length){
    const claseRow=(c)=>{
      const off=c.dow===0?6:c.dow-1, date=ymd(addDays(OPEN_WEEK_START,off));
      const ch=Math.floor(c.startMin/60), cmin=c.startMin%60, dd=dateAt(date,ch);
      const res=reservations.find(r=>r.type==='class' && normHouseKey(r.house)===normHouseKey(c.house) && r.date===date && r.h===ch && (r.min||0)===cmin);
      let act='<span class="pill amber">Clase</span>';
      if(res && (dd-NOW)>3600000) act=`<button class="btn-cancel" onclick="cancelRes(${res.id})">Cancelar</button>`;
      else if(res && dd.getTime()+3600000<=NOW.getTime()) act='<span class="pill gray">Ya pasó</span>';
      return `<div class="row"><div class="info"><b>${SCHED_DOW_NAMES[c.dow]} · ${schedMinLabel(c.startMin)}–${schedMinLabel(c.endMin)}</b><span>Clase con el profesor${hs.length>1?' · '+c.house:''}</span></div>${act}</div>`;
    };
    html+=`<div class="panel" style="margin-top:16px"><div class="panel-h"><h3>Mis clases semanales</h3></div>${myClases.map(claseRow).join('')}</div>`;
  }
  const myPerm=RECURRING.filter(r=>r.status==='active');
  if(myPerm.length){
    html+=`<div class="panel" style="margin-top:16px"><div class="panel-h"><h3>Mis horarios permanentes</h3></div>${myPerm.map(r=>`<div class="row"><div class="info"><b>${SCHED_DOW_NAMES[r.dow]} ${schedMinLabel(r.startMin)}–${schedMinLabel(r.endMin)}</b><span>Clase fija con el profesor · ${r.house}</span></div><button class="btn-cancel" onclick="doCancelRecurring(${r.id})">Cancelar</button></div>`).join('')}</div>`;
  }
  return html;
}

function setClassDay(date){ state.classDay=date; render(); scrollTop(); fadeContent(); }
function classEndMs(c){ return dateAt(c.date,c.h).getTime()+((c.min||0)+c.dur)*60000; }
function classHasUpcoming(date){ return PROF_CLASSES.some(c=>c.date===date && classEndMs(c)>NOW.getTime()); }
function classDaysUpcoming(){                       // días de esta semana con clases por venir (los pasados desaparecen)
  const out=[], g=NOW.getDay(), toSat=(6-g+7)%7;
  for(let i=0;i<=toSat;i++){ const date=ymd(addDays(NOW,i)); if(classHasUpcoming(date)) out.push(date); }
  return out;
}
function cap1(s){ return s? s.charAt(0).toUpperCase()+s.slice(1) : s; }
function classDayChips(){

function needsLight(h){return h<6||h>=18;}  // madrugada (4–6am) y noche (6–11pm)
function viewLights(){
  const ws=ymd(OPEN_WEEK_START), we=OPEN_WEEK_END;
  const lit=reservations.filter(r=>needsLight(r.h) && r.date>=ws && r.date<=we);
  const note=`<div class="quota" style="margin-bottom:18px"><div class="qdots"><span class="qdot on" style="display:flex;align-items:center;justify-content:center;color:#fff">${svgIco(ICONS.bulb,16,'#fff')}</span></div>
    <div class="qtext"><b style="color:var(--ink)">Horarios de luces</b><p>A continuación se indican los horarios para prender y apagar las luces. Por favor, prende <b>10 minutos antes</b> del horario indicado y apaga <b>10 minutos después</b>.</p></div></div>`;
  const byday={};lit.forEach(r=>{(byday[r.date]=byday[r.date]||[]).push(r);});
  const dates=Object.keys(byday).sort();
  let html=note, any=false;
  dates.forEach(date=>{
    const rs=byday[date].slice().sort((a,b)=>a.h-b.h);
    const runs=[];
    rs.forEach(r=>{const last=runs[runs.length-1];const end=r.h+Math.ceil(r.dur/60);
      if(last && r.h===last.end){last.end=end;last.res.push(r);}
      else runs.push({start:r.h,end,res:[r]});});
    const future=runs.filter(run=>dateAt(date,run.end)>=NOW);
    if(!future.length) return;
    any=true;
    const d=dateAt(date,0);const today=date===ymd(NOW);
    html+=`<div class="panel" style="margin-bottom:16px"><div class="panel-h"><h3>${today?'Hoy · ':''}${DOWL[d.getDay()]} ${d.getDate()} de ${MON[d.getMonth()]}</h3></div>`;
    future.forEach(run=>{ html+=lightRow('on',run)+lightRow('off',run); });
    html+=`</div>`;
  });
  if(!any) return note+emptyState('No hay reservas que requieran luces esta semana.');
  return html;
}
function lightRow(kind,run){
  const on=kind==='on';
  const h=on?run.start:run.end;
  const span=`${hlabel(run.start)}–${hlabel(run.end)}`;
  const houses=[...new Set(run.res.map(r=>r.house))].join(', ');
  const detail=run.res.length>1?`${run.res.length} reservas seguidas · ${houses}`:`Reserva ${houses}`;
  return `<div class="row">
    <div class="lbulb ${on?'on':'off'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${ICONS.bulb}</svg></div>
    <div class="when"><div class="h" style="color:${on?'var(--amber)':'var(--muted)'}">${hlabel(h)}</div></div>

}

  let list=[...activity].sort((a,b)=>b.ts-a.ts);
  if(q) list=list.filter(e=>(((e.name||'')+' '+(e.house||'')).toLowerCase().includes(q)));
  if(!list.length) return emptyInline('Sin resultados'+(state.histQuery?' para “'+state.histQuery+'”':'')+'.');
  const BALL='<svg class="hmini" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M5 6a11 11 0 0 0 0 12M19 6a11 11 0 0 1 0 12"/></svg>';
  const CLOCK='<svg class="hmini" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>';
  const rows=list.map(e=>{
    const d=dateAt(e.date,e.h), cancel=e.action==='cancel', w=whenLabel(e.ts);
    const who=e.name===e.house?e.house:`${e.name} · ${e.house}`;
    const extra=e.type==='class'?' (clase)':e.type==='open'?' (libre)':e.type==='profclass'?' (clase del profesor)':'';
    const ico=cancel?'<path d="M18 6L6 18M6 6l12 12"/>':'<path d="M20 6L9 17l-5-5"/>';
    const slot=`${DOWL[d.getDay()]} ${d.getDate()} de ${MON[d.getMonth()]} · ${rangeLabel(e.h,e.min,e.dur)}`;
    const col=cancel?'var(--danger)':'var(--court)';
    return `<div class="hrow">
      <div class="hic ${cancel?'cancel':'reserve'}">${svgIco(ico,16)}</div>
      <div class="hinfo">
        <b>${who}</b>
        <span class="hline">${BALL}<span><span class="hlbl">Cancha:</span> <strong class="hslot">${slot}</strong>${extra}</span></span>
        <span class="hline">${CLOCK}<span><strong style="color:${col}">${cancel?'Canceló':'Reservó'}</strong> <span class="hwhen-t">el ${w.dia}, ${w.hora}</span></span></span>
      </div>
    </div>`;}).join('');
  return `<div class="panel">${rows}</div>`;
}

// Botón "Activar" de la pantalla de notificaciones: solo activa; al quedar activo, muestra "Activadas" e inerte.
async function notifActivate(){
  try{
    if(!pushSupported()){ toast('Este dispositivo no soporta notificaciones.','warn'); return; }
    if(Notification.permission==='denied'){ toast('Las tienes bloqueadas en el navegador; actívalas en los ajustes del sitio.','warn'); return; }
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){ toast('No diste permiso para las notificaciones.','warn'); return; }
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:urlB64ToUint8Array(DB.VAPID_PUBLIC_KEY) });
    await DB.savePushSub(state.profile.id, sub);
    toast('Notificaciones activadas ✓'); refreshNotifActivate();
  }catch(e){ toast('No se pudieron activar las notificaciones.','warn'); }
}
async function refreshNotifActivate(){
  const b=document.getElementById('ntfActivate'); if(!b) return;
  const set=(txt,done)=>{ b.textContent=txt; b.disabled=!!done; b.classList.toggle('done',!!done); b.classList.toggle('act',!done); };
  if(!pushSupported()){ set('No disponible', true); return; }
  if(Notification.permission==='denied'){ set('Bloqueadas', true); return; }
  try{ const sub=await getPushSub(); set(sub?'Activadas ✓':'Activar', !!sub); }catch(e){ set('Activar', false); }
}
/* ---- Notificaciones push (residente) ---- */
function pushSupported(){ return ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window); }
function urlB64ToUint8Array(base64){ const pad='='.repeat((4-base64.length%4)%4); const b=(base64+pad).replace(/-/g,'+').replace(/_/g,'/'); const raw=atob(b); const arr=new Uint8Array(raw.length); for(let i=0;i<raw.length;i++) arr[i]=raw.charCodeAt(i); return arr; }
async function getPushSub(){ if(!pushSupported())return null; try{ const reg=await navigator.serviceWorker.ready; return await reg.pushManager.getSubscription(); }catch(e){ return null; } }
async function enablePush(){
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){ toast('No diste permiso para las notificaciones.','warn'); return; }
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:urlB64ToUint8Array(DB.VAPID_PUBLIC_KEY) });
    await DB.savePushSub(state.profile.id, sub);
    toast('Notificaciones activadas en este dispositivo'); openNotifSettings();
  }catch(e){ toast('No se pudieron activar las notificaciones.','warn'); }
}
async function disablePush(){
  try{
    const sub=await getPushSub();
    if(sub){ const ep=sub.endpoint; try{ await sub.unsubscribe(); }catch(_){} await DB.removePushSub(ep); }
    closeModal(); render(); toast('Notificaciones desactivadas en este dispositivo');
  }catch(e){ toast(e.message,'warn'); }
}

const SCHED_DOW_NAMES=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const DOW_ABBR=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
function fmtHoras(mins){ if(mins<=0) return '0'; const h=Math.floor(mins/60), rem=mins%60; if(h===0) return rem+' min'; return h+(rem>=30?'½':'')+' h'; }
function schedMinLabel(m){const h=Math.floor(m/60),mm=m%60;const ap=h<12?'am':'pm';let hh=h%12;if(hh===0)hh=12;return hh+(mm?':'+String(mm).padStart(2,'0'):'')+ap;}
function schedFallbackRows(){ const r=[]; [2,3,4,5].forEach(d=>{r.push({dow:d,startMin:360,endMin:750});r.push({dow:d,startMin:810,endMin:1020});}); r.push({dow:6,startMin:360,endMin:720}); return r; }
const PROF_DAY_BASE=[{startMin:420,endMin:540},{startMin:600,endMin:720},{startMin:840,endMin:1020}];  // base al prender un día de clases: 7–9, 10–12, 2–5pm
const MAINT_DAY_BASE=[{startMin:360,endMin:420}];  // base al prender un día de mantenimiento: 6–7
function cpRanges(a){ return (a||[]).map(r=>({startMin:r.startMin,endMin:r.endMin})); }
function rangesEqual(a,b){
  a=cpRanges(a).sort((x,y)=>x.startMin-y.startMin||x.endMin-y.endMin);
  b=cpRanges(b).sort((x,y)=>x.startMin-y.startMin||x.endMin-y.endMin);
  if(a.length!==b.length) return false;
  for(let i=0;i<a.length;i++) if(a[i].startMin!==b[i].startMin||a[i].endMin!==b[i].endMin) return false;
  return true;
}
function initSchedDraft(){
  const src=(PROF_SCHEDULE&&PROF_SCHEDULE.length)?PROF_SCHEDULE:schedFallbackRows();
  state.schedDraft={}; for(let d=0;d<7;d++) state.schedDraft[d]=[];
  src.forEach(r=>{ (state.schedDraft[r.dow]=state.schedDraft[r.dow]||[]).push({startMin:r.startMin,endMin:r.endMin}); });
  for(let d=0;d<7;d++) state.schedDraft[d].sort((a,b)=>a.startMin-b.startMin);
  state.schedSaved={}; for(let d=0;d<7;d++) state.schedSaved[d]=cpRanges(state.schedDraft[d]);
}
function schedEditorHTML(){
  if(!state.schedDraft) initSchedDraft();
  const step=HALF_HOURS?30:60, first=HALF_HOURS?240:300;
  const opts=[]; for(let m=first;m<=1380;m+=step) opts.push({v:m,label:schedMinLabel(m)});
  const order=[1,2,3,4,5,6];   // lunes a sábado (sin domingo: el profesor no asiste)
  // Igual que en mantenimiento: mantener visible el día vacío-con-cambios para poder "Guardar" al quitar el último.
  const onDays=order.filter(d=>(state.schedDraft[d]||[]).length>0 || !rangesEqual(state.schedDraft[d]||[], state.schedSaved[d]||[]));
  const cards=onDays.map(d=>{
    const rgs=state.schedDraft[d];
    const nCl=rgs.reduce((s,r)=>s+Math.max(0,Math.round((r.endMin-r.startMin)/60)),0);
    const rows=rgs.map((rg,i)=>{
      // Las clases son de 1 hora: el "Hasta" solo ofrece horas completas desde el "Desde".
      const endOpts=[]; for(let m=rg.startMin+60;m<=1380;m+=60) endOpts.push({v:m,label:schedMinLabel(m)});
      const clash=profClash(d,rg);
      return `<div class="sched-row${clash?' clash':''}">
        ${psel('psch_s_'+d+'_'+i, opts, rg.startMin, 'schedSync')}
        <span class="sched-a">a</span>
        ${psel('psch_e_'+d+'_'+i, endOpts, rg.endMin, 'schedSync')}
        <button class="sched-del" title="Quitar" onclick="schedDel(${d},${i})">✕</button>
      </div>${clash?`<div class="sched-warn">⚠ Choca con mantenimiento.</div>`:''}`; }).join('');
    const dirty=!rangesEqual(state.schedDraft[d], state.schedSaved[d]);
    const foot=`<div class="sched-foot"><button class="sched-add" onclick="schedAdd(${d})">+ Agregar</button>${dirty?`<button class="sched-savebtn" onclick="saveProfDay(${d})">Guardar</button>`:''}</div>`;
    return `<div class="sched-day">
      <div class="sched-dh"><b>${SCHED_DOW_NAMES[d]}</b><span class="sched-count">${rgs.length?`${nCl} ${nCl===1?'clase':'clases'}`:'—'}</span></div>
      <div class="sched-body">${rows||'<div style="font-size:12.5px;color:var(--muted);padding:2px 2px 6px;line-height:1.4">Sin clases. Guarda para quitarlas de este día.</div>'}${foot}</div>
    </div>`;
  }).join('');
  return onDays.length? `<div class="sched-grid">${cards}</div>` : `<div class="sched-off" style="padding:16px 0">No hay días con clases. Agrégalos con el botón “Días con clases”.</div>`;
}
function schedRerender(){ const el=document.getElementById('schedInline'); if(el) el.innerHTML=schedEditorHTML(); }
function schedAdd(d){ (state.schedDraft[d]=state.schedDraft[d]||[]).push({startMin:360,endMin:420}); schedRerender(); }
function schedDel(d,i){ state.schedDraft[d].splice(i,1); schedRerender(); }
function schedSet(d,i,k,v){ const r=state.schedDraft[d]&&state.schedDraft[d][i]; if(!r) return; r[k]=+v; if(k==='startMin'){ if(r.endMin<=r.startMin) r.endMin=r.startMin+(HALF_HOURS?30:60); schedRerender(); } }
function profClash(d,rg){ return (MAINT_SCHEDULE||[]).some(m=>m.dow===d && rg.startMin<m.endMin && rg.endMin>m.startMin); }
function schedSync(){
  for(let d=1;d<=6;d++){ (state.schedDraft[d]||[]).forEach((rg,i)=>{
    const s=document.getElementById('psch_s_'+d+'_'+i), e=document.getElementById('psch_e_'+d+'_'+i);
    if(s) rg.startMin=+s.value; if(e) rg.endMin=+e.value;
    // Clases de 1 hora: el rango debe durar horas completas (ajusta si quedó incompleto).
    const dur=rg.endMin-rg.startMin;
    if(dur<60 || dur%60!==0) rg.endMin=rg.startMin+Math.max(1,Math.round(dur/60))*60;
  }); }
  schedRerender();
}
// Guarda SOLO ese día (los demás días conservan su estado guardado y sus ediciones pendientes).
async function saveProfDay(d){
  const draft=state.schedDraft, saved=state.schedSaved;
  let bad=false, notWhole=false; const conflicts=[];
  (draft[d]||[]).forEach(r=>{
    if(r.endMin<=r.startMin) bad=true;
    else if((r.endMin-r.startMin)%60!==0) notWhole=true;
    else if(profClash(d,r)) conflicts.push(schedMinLabel(r.startMin)+'–'+schedMinLabel(r.endMin));
  });
  if(bad){ toast('Revisa: la hora de fin debe ser mayor que la de inicio.','warn'); return; }
  if(notWhole){ toast('Las clases son de 1 hora: cada rango debe durar horas completas (ej. 7:00–8:00, no 7:00–8:30).','warn'); return; }
  if(conflicts.length){ toast('Ese horario choca con mantenimiento ('+conflicts.join(', ')+'). Ajusta el mantenimiento primero.','warn'); return; }
  const rows=[];
  for(let x=1;x<=6;x++){ const src=(x===d)?(draft[x]||[]):(saved[x]||[]); src.forEach(r=>rows.push({dow:x,startMin:r.startMin,endMin:r.endMin})); }
  try{ await DB.Admin.setProfSchedule(rows); }
  catch(e){ toast(e.message,'warn'); return; }
  saved[d]=cpRanges(draft[d]);
  await loadData(); render();

}
function initMaintDraft(){
  const src=MAINT_SCHEDULE||[];
  state.maintDraft={}; for(let d=0;d<7;d++) state.maintDraft[d]=[];
  src.forEach(r=>{ (state.maintDraft[r.dow]=state.maintDraft[r.dow]||[]).push({startMin:r.startMin,endMin:r.endMin}); });
  for(let d=0;d<7;d++) state.maintDraft[d].sort((a,b)=>a.startMin-b.startMin);
  state.maintSaved={}; for(let d=0;d<7;d++) state.maintSaved[d]=cpRanges(state.maintDraft[d]);
}
function maintEditorHTML(){
  if(!state.maintDraft) initMaintDraft();
  const step=10, first=HALF_HOURS?240:300;   // cada 10 min: permite mantenimientos cortos (p. ej. 6:40 a 7:00)
  const opts=[]; for(let m=first;m<=1380;m+=step) opts.push({v:m,label:schedMinLabel(m)});
  const order=[1,2,3,4,5,6];
  // Se muestra un día si tiene elementos O si quedó vacío pero con cambios sin guardar
  // (para poder darle "Guardar" cuando quitas el último; si no, la tarjeta desaparecía y no se podía guardar).
  const onDays=order.filter(d=>(state.maintDraft[d]||[]).length>0 || !rangesEqual(state.maintDraft[d]||[], state.maintSaved[d]||[]));
  const cards=onDays.map(d=>{
    const rgs=state.maintDraft[d];
    const mins=rgs.reduce((s,r)=>s+Math.max(0,r.endMin-r.startMin),0);
    const rows=rgs.map((rg,i)=>{ const clash=maintClash(d,rg); return `<div class="sched-row${clash?' clash':''}">
        ${psel('pmnt_s_'+d+'_'+i, opts, rg.startMin, 'maintSync')}
        <span class="sched-a">a</span>
        ${psel('pmnt_e_'+d+'_'+i, opts.filter(o=>o.v>rg.startMin), rg.endMin, 'maintSync')}
        <button class="sched-del" title="Quitar" onclick="maintDel(${d},${i})">✕</button>
      </div>${clash?`<div class="sched-warn">⚠ Choca con una clase del profesor.</div>`:''}`; }).join('');
    const dirty=!rangesEqual(state.maintDraft[d], state.maintSaved[d]);
    const foot=`<div class="sched-foot"><button class="sched-add" onclick="maintAdd(${d})">+ Agregar</button>${dirty?`<button class="sched-savebtn" onclick="saveMaintDay(${d})">Guardar</button>`:''}</div>`;
    return `<div class="sched-day">
      <div class="sched-dh"><b>${SCHED_DOW_NAMES[d]}</b><span class="sched-count">${rgs.length?fmtHoras(mins):'—'}</span></div>
      <div class="sched-body">${rows||'<div style="font-size:12.5px;color:var(--muted);padding:2px 2px 6px;line-height:1.4">Sin mantenimiento. Guarda para quitarlo de este día.</div>'}${foot}</div>
    </div>`;
  }).join('');
  return onDays.length? `<div class="sched-grid">${cards}</div>` : `<div class="sched-off" style="padding:16px 0">No hay días con mantenimiento. Agrégalos con el botón “Días con mantenimiento”.</div>`;
}
function maintClash(d,rg){ return PROF_SCHEDULE.some(p=>p.dow===d && rg.startMin<p.endMin && rg.endMin>p.startMin); }
function maintRerender(){ const el=document.getElementById('maintInline'); if(el) el.innerHTML=maintEditorHTML(); }
function maintAdd(d){ (state.maintDraft[d]=state.maintDraft[d]||[]).push({startMin:360,endMin:420}); maintRerender(); }
function maintDel(d,i){ state.maintDraft[d].splice(i,1); maintRerender(); }
function maintSet(d,i,k,v){ const r=state.maintDraft[d]&&state.maintDraft[d][i]; if(!r) return; r[k]=+v; if(k==='startMin'){ if(r.endMin<=r.startMin) r.endMin=r.startMin+(HALF_HOURS?30:60); maintRerender(); } }
function maintSync(){
  for(let d=1;d<=6;d++){ (state.maintDraft[d]||[]).forEach((rg,i)=>{

  }); }
  maintRerender();
}
// Guarda SOLO ese día (los demás conservan su estado guardado y ediciones pendientes).
async function saveMaintDay(d){
  const draft=state.maintDraft, saved=state.maintSaved;
  let bad=false; const conflicts=[];
  (draft[d]||[]).forEach(r=>{
    if(r.endMin<=r.startMin) bad=true;

  });
  if(bad){ toast('Revisa: la hora de fin debe ser mayor que la de inicio.','warn'); return; }
  if(conflicts.length){ toast('El mantenimiento no puede caer en horas de clase ('+conflicts.join(', ')+'). Ponlo antes, después o en el descanso del mediodía.','warn'); return; }
  const rows=[];
  for(let x=1;x<=6;x++){ const src=(x===d)?(draft[x]||[]):(saved[x]||[]); src.forEach(r=>rows.push({dow:x,startMin:r.startMin,endMin:r.endMin})); }

}

async function confirmDaysModal(){
  const kind=state.daysModal, on=state.daysModalOn;
  const draft = kind==='prof'? state.schedDraft : state.maintDraft;
  const saved = kind==='prof'? state.schedSaved : state.maintSaved;
  const base  = kind==='prof'? PROF_DAY_BASE : MAINT_DAY_BASE;
  const turnedOn=[], turnedOff=[]; const rows=[];
  for(let d=1;d<=6;d++){
    const wasOn=(saved[d]||[]).length>0;
    if(on[d]){
      if(wasOn){ (saved[d]).forEach(r=>rows.push({dow:d,startMin:r.startMin,endMin:r.endMin})); }
      else { turnedOn.push(d); base.forEach(r=>rows.push({dow:d,startMin:r.startMin,endMin:r.endMin})); }
    } else if(wasOn){ turnedOff.push(d); }
  }
  if(!turnedOn.length && !turnedOff.length){ state.daysModal=null; closeModal(); return; }   // sin cambios de días
  try{
    if(kind==='prof') await DB.Admin.setProfSchedule(rows); else await DB.Admin.setMaintSchedule(rows);
  }catch(e){
    const msg=(e.message==='CLASE_CHOCA_MANT'||e.message==='MANT_CHOCA_CLASE')
      ? 'Un día que prendiste choca en su horario base con el otro calendario. Ajusta primero el otro y vuelve a intentar.' : e.message;
    toast(msg,'warn'); return;
  }
  turnedOff.forEach(d=>{ draft[d]=[]; saved[d]=[]; });
  turnedOn.forEach(d=>{ draft[d]=cpRanges(base); saved[d]=cpRanges(base); });
  const flat=rows.map(r=>({dow:r.dow,startMin:r.startMin,endMin:r.endMin}));
  if(kind==='prof') PROF_SCHEDULE=flat; else MAINT_SCHEDULE=flat;
  state.daysModal=null; state.daysModalOn=null;
  closeModal(); await loadData(); render();
  toast(kind==='prof'?'Días con clases actualizados':'Días con mantenimiento actualizados');
}

function classDays(){                       // días con clases (sin lunes ni domingo), cada uno con sus horas
  const days=[{dow:2,name:'Martes'},{dow:3,name:'Miércoles'},{dow:4,name:'Jueves'},{dow:5,name:'Viernes'},{dow:6,name:'Sábado'}];
  days.forEach(d=>{ d.slots=[];
    PROF_SCHEDULE.filter(r=>r.dow===d.dow).sort((a,b)=>a.startMin-b.startMin)
      .forEach(b=>{ for(let m=b.startMin; m+60<=b.endMin; m+=60) d.slots.push(m); });
  });

// Clave de casa normalizada: "Casa 29A", "29 a" -> "29A".
function normHouseKey(s){ return String(s||'').replace(/^\s*casa\s+/i,'').replace(/\s+/g,'').toUpperCase(); }
// Nombre en formato título: "juan PEREZ" -> "Juan Perez".
function titleName(s){ return String(s||'').trim().toLowerCase().split(/\s+/).filter(Boolean).map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' '); }
// Primer nombre normalizado (sin tildes) para comparar si es la MISMA persona.
function firstToken(s){ return String(s||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').split(/\s+/)[0]||''; }
// Mapa: casa (registrada, con cuenta activa) -> nombre de la cuenta.
function houseNameMap(){ const m={}; (users||[]).forEach(u=>{ if((u.role==='member'||u.role==='master') && u.active){ (u.houses||[]).forEach(hh=>{ const k=normHouseKey(hh); if(k && !m[k]) m[k]=u.name; }); } }); return m; }
function exportTemplate(){
  if(typeof XLSX==='undefined'){ toast('No se pudo cargar el generador de Excel.','warn'); return; }
  const accMap=houseNameMap();
  const days=classDays();
  const maxRows=Math.max(0,...days.map(d=>d.slots.length));
  if(!maxRows){ toast('No hay horas de clase en el horario del profesor.','warn'); return; }
  const cur=(dow,m)=>CLASS_TEMPLATE.find(c=>c.dow===dow&&c.startMin===m);
  // fila 0: nombre del día (unido sobre sus 3 columnas). fila 1: Hora | Casa | Nombre.
  const h1=[]; days.forEach(d=>h1.push(d.name,'',''));
  const h2=[]; days.forEach(()=>h2.push('Hora','Casa','Nombre'));
  const rows=[h1,h2];
  for(let i=0;i<maxRows;i++){
    const row=[];
    days.forEach(d=>{ const m=d.slots[i];
      if(m==null){ row.push('','',''); }
      else { const c=cur(d.dow,m); const hCasa=(c&&c.house)||''; const stored=(c&&c.student_name)||''; const acc=hCasa?accMap[normHouseKey(hCasa)]:null; const nm=(acc && firstToken(acc)===firstToken(stored))?acc:stored; row.push(schedMinLabel(m)+'–'+schedMinLabel(m+60), hCasa, nm); }
    });
    rows.push(row);
  }
  const ws=XLSX.utils.aoa_to_sheet(rows);
  // unir el nombre del día sobre sus 3 columnas
  ws['!merges']=days.map((d,i)=>({s:{r:0,c:i*3},e:{r:0,c:i*3+2}}));
  // anchos: Hora 13, Casa 10, Nombre 20 por cada día
  const cols=[]; days.forEach(()=>{cols.push({wch:13},{wch:10},{wch:22});}); ws['!cols']=cols;
  ws['!rows']=[{hpt:24},{hpt:19}];
  // Estilos (xlsx-js-style): encabezados con sombreado; columna Hora con gris muy claro
  const bord={style:'thin',color:{rgb:'D9E2DE'}};
  const allBorder={top:bord,bottom:bord,left:bord,right:bord};
  const dayFill=days.map((d,i)=>({r:0,c:i*3}));
  const ncols=days.length*3;
  const setS=(r,c,s)=>{ const a=XLSX.utils.encode_cell({r,c}); if(!ws[a]) ws[a]={t:'s',v:''}; ws[a].s=s; };
  // fila 0 (nombres de día): verde suave, blanco, centrado, negrita
  for(let c=0;c<ncols;c++) setS(0,c,{fill:{fgColor:{rgb:'14564A'}},font:{bold:true,sz:12,color:{rgb:'FFFFFF'}},alignment:{horizontal:'center',vertical:'center'},border:allBorder});
  // fila 1 (Hora/Casa/Nombre): gris claro, negrita, centrado
  for(let c=0;c<ncols;c++) setS(1,c,{fill:{fgColor:{rgb:'EBF1EF'}},font:{bold:true,sz:10,color:{rgb:'33413D'}},alignment:{horizontal:'center'},border:allBorder});
  // cuerpo: bordes suaves; columna Hora (cada 3) en gris muy claro y centrada
  for(let r=2;r<rows.length;r++) for(let c=0;c<ncols;c++){
    const isHora=(c%3===0);
    setS(r,c,{border:allBorder, alignment:{horizontal:isHora?'center':'left',vertical:'center'}, ...(isHora?{fill:{fgColor:{rgb:'F5F8F7'}},font:{color:{rgb:'5F6B66'},sz:10}}:{})});
  }
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Clases');
  XLSX.writeFile(wb, 'plantilla_clases.xlsx');
  toast('Plantilla descargada');
}
async function importTemplate(file){
  if(typeof XLSX==='undefined'){ toast('No se pudo cargar el lector de Excel.','warn'); return; }
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1});
    const days=classDays();
    // por día: etiqueta de hora -> minutos (para identificar el bloque aunque muevan filas)
    days.forEach(d=>{ d.labelToMin={}; d.slots.forEach(m=>{ d.labelToMin[schedMinLabel(m)+'–'+schedMinLabel(m+60)]=m; }); });
    const accMap=houseNameMap();
    const entries=[]; const seen={};
    for(let i=2;i<rows.length;i++){ const r=rows[i]; if(!r||!r.length) continue;   // fila 0 y 1 = encabezados
      days.forEach((d,di)=>{
        const hl=(r[di*3]!=null?String(r[di*3]):'').trim();
        const m=d.labelToMin[hl]; if(m==null) return;                 // hora vacía o no válida para ese día
        const key=d.dow+'|'+m; if(seen[key]) return; seen[key]=1;      // una entrada por bloque
        const house=(r[di*3+1]!=null?String(r[di*3+1]):'').trim();
        const name =(r[di*3+2]!=null?String(r[di*3+2]):'').trim();
        const nk=house?normHouseKey(house):'';
        // "Casa 000" / "Disponible" / celda totalmente vacía → SIN clase (esa hora queda del profesor).
        if(nk==='000' || /^disponible$/i.test(name) || (!house && !name)) return;
        const acc = nk ? accMap[nk] : null;
        // Casa con cuenta: si el nombre va vacío O coincide el primer nombre → usa el nombre de la cuenta.
        // Otro miembro de la familia (primer nombre distinto) → se respeta su nombre, bien escrito.
        const student = (acc && (!name || firstToken(acc)===firstToken(name))) ? acc : titleName(name);
        entries.push({dow:d.dow, start_min:m, end_min:m+60, house, student});
      });
    }
    if(!entries.length){ toast('No se reconocieron filas (revisa el formato de la plantilla).','warn'); return; }
    await DB.setClassTemplate(entries);
    if(DB.materializeClasses) await DB.materializeClasses();
    await loadData(); render();
    toast('Plantilla importada · '+entries.length+' clases actualizadas');
  }catch(e){ toast('No se pudo leer el archivo: '+(e.message||e),'warn'); }
}

// Copia una lista para WhatsApp: "- #Casa, Nombre y Apellido" (residentes activos, por número de casa).
function copyUsersList(){
  const isFx=u=>(u.role==='admin'||u.role==='prof'||u.role==='portero');
  const lines=[];
  users.filter(u=>!isFx(u) && u.active).forEach(u=>{
    const hs=(u.houses&&u.houses.length)?u.houses:[u.requestedHouse].filter(Boolean);
    hs.forEach(lbl=>{ const short=String(lbl).replace(/^\s*casa\s+/i,'').trim()||String(lbl); const n=parseInt(short.replace(/[^\d]/g,''),10)||999999; lines.push({n, text:`- #${short}, ${u.name}`}); });
  });
  lines.sort((a,b)=>a.n-b.n);
  const txt=lines.map(l=>l.text).join('\n');
  if(!txt){ toast('No hay residentes inscritos para copiar.','warn'); return; }
  copyText(txt);
  toast('Lista copiada ('+lines.length+') · pégala en WhatsApp');
}
function copyText(t){
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).catch(()=>fallbackCopy(t)); return; } }catch(e){}
  fallbackCopy(t);
}
function fallbackCopy(t){
  const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.top='-1000px'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}

/* --- casas: validación y aviso en vivo (existe vs nueva) para no duplicar --- */
function houseCode(v){ return (v||'').trim().replace(/^casa\s+/i,'').replace(/\s+/g,''); }       // "Casa 29 A" -> "29A"
function houseValid(v){ const c=houseCode(v); return /^[0-9A-Za-z]+$/.test(c); }                  // solo números y letras
function userValid(u){ return /^[a-z0-9._-]{3,20}$/.test((u||'').trim().toLowerCase()); }          // usuario: 3–20, sin espacios
function canonHouse(v){ return (window.DB&&DB.normHouse)?DB.normHouse(v):('Casa '+houseCode(v).toUpperCase()); }
function houseExists(canon){ return houses.some(h=>h.toLowerCase()===canon.toLowerCase()); }
function houseHint(inputId, hintId){
  const v=document.getElementById(inputId).value||''; const el=document.getElementById(hintId); if(!el) return;
  const c=houseCode(v);
  if(!c){ el.textContent=''; return; }
  if(!houseValid(v)){ el.textContent='Solo números y letras (ej. 29A).'; el.style.color='#c0392b'; return; }
  const canon=canonHouse(v);
  if(houseExists(canon)){ el.textContent='✓ Casa existente: '+canon; el.style.color='var(--court)'; }
  else { el.textContent='Se creará una casa nueva: '+canon; el.style.color='#b8860b'; }
}
// Cuentas de residente YA vinculadas a una casa (para avisar al admin si aprueba una 2ª cuenta).
function accountsForHouse(label){
  const k=normHouseKey(label); if(!k) return [];
  return (users||[]).filter(u=>(u.role==='member'||u.role==='master') && (u.houses||[]).some(hh=>normHouseKey(hh)===k)).map(u=>u.name);
}

/* ---- helpers de formularios (disponibilidad por media hora) ---- */
function profMinSlots(dow){const a=[];for(let h=4;h<=22;h++)for(const half of [0,1])if(isProfHalf(dow,h,half))a.push(h*60+half*30);return a;}
function timeMin(m){let H=Math.floor(m/60),M=m%60;const ap=H<12?'am':'pm';let hh=H%12;if(hh===0)hh=12;return hh+':'+String(M).padStart(2,'0')+ap;}
function refreshAvailTo(){
  const dow=parseYMD(state.availDate).getDay();
  const from=+document.getElementById('aFrom').value;
  const ends=profMinSlots(dow).map(m=>m+30).filter(e=>e>from);
  const cur=+document.getElementById('aTo').value;
  pselSet('aTo', ends.map(m=>({v:m,label:timeMin(m)})), ends.includes(cur)?cur:(ends[0]||''));
}
/* ---- mini calendario (estilo aerolínea) ---- */
let calView={};
function parseYMD(s){const[Y,M,D]=s.split('-').map(Number);return new Date(Y,M-1,D);}
function firstOfMonth(d){return new Date(d.getFullYear(),d.getMonth(),1);}
function capMonth(d){const m=MESES[d.getMonth()];return m[0].toUpperCase()+m.slice(1)+' '+d.getFullYear();}
function fmtLong(s){const d=parseYMD(s);return `${DOWL[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`;}
function miniCal(id,opts){
  const min=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()), max=parseYMD(AVAIL_MAX);
  if(!calView[id]) calView[id]=firstOfMonth(opts.anchor?parseYMD(opts.anchor):min);
  const view=calView[id], canPrev=view>firstOfMonth(min), canNext=view<firstOfMonth(max);
  let html=`<div class="minical"><div class="mc-head">
      <button ${canPrev?'':'disabled'} onclick="calNav('${id}',-1)">‹</button>
      <b>${capMonth(view)}</b>
      <button ${canNext?'':'disabled'} onclick="calNav('${id}',1)">›</button>
    </div>

// Minutos libres seguidos (bloques normales) desde una hora/media, hasta el cierre.
function freeRunMin(date,h,half){
  let mins=0, ch=h, chalf=half||0, guard=0;
  while(guard++<48){
    if(ch>=OPEN_END) break;
    if(halfState(date,ch,chalf).kind!=='free') break;
    mins+=30; chalf++; if(chalf>1){chalf=0;ch++;}
  }
  return mins;
}
function durLabel(m){ if(m<60) return m+' min'; const H=Math.floor(m/60), r=m%60; return H+(r>=30?'½':'')+' h'; }

function durSegHTML(date,h,house){
  const run=freeRunMin(date,h,0);                    // tope = libre seguido, y que quepa en el cupo pico / horas libres
  const step=HALF_HOURS?30:60;
  const durs=[];
  if(HALF_HOURS && run>=30 && bookFits(date,h*60,30,house)) durs.push(30);   // media hora (solo si está permitida)
  for(let d=60; d<=run; d+=step) if(bookFits(date,h*60,d,house)) durs.push(d);   // 1h, (1½), 2h, ... hasta el tope
  if(!durs.length) durs.push(HALF_HOURS?30:60);
  const def = durs.includes(60)?60:durs[0];
  const btns = durs.map(d=>`<button class="${d===def?'on':''}" data-d="${d}" onclick="durPick(this)">${durLabel(d)}</button>`).join('');
  return `<div class="opt-label">Duración</div>

    <div id="halfWrap" style="display:${def===30?'block':'none'}">

        <button data-m="30" onclick="segPick(this,'halfSeg')">${rangeLabel(h,30,30)}</button>
      </div>
    </div>`;
}

function fullDurs(date,h,house,half){
  half=half||0;
  const run=freeRunMin(date,h,half), st=h*60+half*30;   // tope: libre seguido + cupo pico del tramo + horas libres a la vez
  const step=HALF_HOURS?30:60; let durs=[];
  if(HALF_HOURS && run>=30 && bookFits(date,st,30,house)) durs.push(30);
  for(let dd=60; dd<=run; dd+=step) if(bookFits(date,st,dd,house)) durs.push(dd);
  if(!durs.length) durs.push(HALF_HOURS?30:60);
  return durs.slice(0,4);   // hasta 4 opciones (2×2)
}
function bookRangeTxt(startMin,dur,date){
  const s=startMin, e=date?playEndMin(date,s+dur):s+dur;   // si después arranca un mantenimiento a mitad de media hora, se juega hasta ese momento
  const ap=t=>Math.floor(t/60)<12?'a.m.':'p.m.', hh=t=>{const H=Math.floor(t/60)%12;return H||12;}, mm=t=>':'+String(t%60).padStart(2,'0'), f=t=>hh(t)+mm(t);   // siempre con :00
  return ap(s)===ap(e) ? f(s)+' – '+f(e)+' '+ap(e) : f(s)+' '+ap(s)+' – '+f(e)+' '+ap(e);
}

// ---- Editar duración de una reserva existente (pantalla "Mi reserva") ----
function editDurs(r){
  const endMin=r.h*60+(r.min||0)+r.dur, endH=Math.floor(endMin/60), endHalf=(endMin%60)>=30?1:0;
  const freeAfter=freeRunMin(r.date,endH,endHalf);                              // minutos libres tras el fin actual
  const step=HALF_HOURS?30:60, start=HALF_HOURS?30:60; let durs=[];
  // Tope: libre seguido, cupo pico del tramo y horas libres a la vez (esta reserva ya cuenta en ambos).
  const s0=r.h*60+(r.min||0), ownPk=resPeakMin(r), ownFr=r.dur-ownPk;
  const pkCap=Math.round(blockRemaining(r.house,blockForDate(r.date))*60)+ownPk, frCap=Math.round(freeLeft()*60)+ownFr;
  let maxDur=r.dur+freeAfter;
  while(maxDur>r.dur){ const pk=FREE_ENABLED?peakMinutes(r.date,s0,s0+maxDur):maxDur, fr=maxDur-pk;
    if(pk<=pkCap && (!FREE_ENABLED || !isMember() || fr<=frCap)) break; maxDur-=step; }
  for(let dd=start; dd<=maxDur; dd+=step) durs.push(dd);
  if(!durs.includes(r.dur)) durs.push(r.dur);
  durs.sort((a,b)=>a-b);
  if(durs.length>4){ let ci=durs.indexOf(r.dur), sIdx=Math.max(0,ci-1); if(sIdx+4>durs.length) sIdx=durs.length-4; durs=durs.slice(sIdx,sIdx+4); }
  return durs;
}

async function confirmBook(date,h,ctx){
  // Horario permanente: si se eligió "Permanente" en una hora flexible, se envía una SOLICITUD (no se reserva)
  if(ctx.indexOf('flex')===0){
    const u=document.querySelector('#flexType button.on');
    if(u && u.dataset.u==='perm'){
      const dow=dateAt(date,h).getDay();
      let sm,em;
      if(ctx==='flexfull'){sm=h*60;em=h*60+60;} else {sm=h*60+(ctx==='flexh1'?30:0);em=sm+30;}
      const hsel=document.getElementById('bkHouse');
      const house = hsel ? hsel.value : state.user.house;
      const houseId=houseIdByLabel[house];
      if(!houseId){ toast('No se encontró esa casa.','warn'); return; }
      closeModal();
      try{ await DB.requestRecurring(houseId, dow, sm, em); await loadData(); render(); toast('Solicitud enviada. Te avisaremos cuando la aprueben.'); }
      catch(e){ toast(e.message,'warn'); }
      return;
    }
  }
  let min=0,dur=60,type='normal';
  if(ctx==='h0'||ctx==='h1'){
    min=(ctx==='h1')?30:0;
    const dEl=document.querySelector('#durSeg button.on');   // diseño nuevo: grilla de duración; si es bonus (sin grilla) → 30 min
    dur=dEl?+dEl.dataset.d:30;
  }
  else if(ctx==='full'){const dEl=document.querySelector('#durSeg button.on');dur=dEl?+dEl.dataset.d:60;if(dur===30){const mEl=document.querySelector('#halfSeg button.on');min=mEl?+mEl.dataset.m:0;}}
  else if(ctx==='openfull'){type='open';}
  else if(ctx==='classfull'){const u=document.querySelector('#useType button.on');type=(u&&u.dataset.u==='free')?'open':'class';}
  else if(ctx==='flexfull'){const u=document.querySelector('#flexType button.on');type=(u&&u.dataset.u==='sin')?'open':'class';min=0;dur=60;}
  else if(ctx==='flexh0'||ctx==='flexh1'){const u=document.querySelector('#flexType button.on');type=(u&&u.dataset.u==='sin')?'open':'class';min=(ctx==='flexh1')?30:0;dur=30;}
  // media hora liberada por el profesor (bonus): toma el tipo de la liberación
  let relHalf=null;
  if(ctx==='h0'||ctx==='h1'){
    relHalf=findReleasedHalf(date,h,min/30);
    if(relHalf){
      if(relHalf.type==='class'){const u=document.querySelector('#useType button.on');type=(u&&u.dataset.u==='free')?'open':'class';}
      else type='open';
    }
  }
  // determinar la casa
  let house;
  const hsel=document.getElementById('bkHouse');
  house = hsel ? hsel.value : state.user.house;
  const houseId=houseIdByLabel[house];
  if(!houseId){ toast('No se encontró esa casa.','warn'); return; }
  if(isMember()&&myHouses().length>1) state.lastHouse=house; // recordar última casa elegida
  const sw=document.getElementById('bkSeek'); const seek = (ctx==='full'||ctx==='h0'||ctx==='h1') && !!(sw && sw.classList.contains('on'));   // ¿pidió contrincante? (leer antes de cerrar)
  closeModal();
  try{
    const newRes = await DB.book({houseId, date, h, min, dur, type});   // el servidor valida cupo, horario, choque
    if(seek && newRes && newRes.id){ try{ await DB.requestMatch(newRes.id); }catch(_){} }   // arranca la búsqueda de contrincante
    await loadData(); render();
    toast(state.role==='portero'?('Reserva creada a nombre de '+house):('Reserva confirmada'+(seek?' · buscando contrincante':(dur!==60?' · '+durLabel(dur):''))));
  }catch(e){ await loadData(); render(); toast(e.message,'warn'); }
}

function openHalfSlot(date,m,t){ // abre una media-hora (m = minuto de inicio) si es del profesor; devuelve 1 si abrió

}
async function doRelease(){
  const t=document.querySelector('#aType button.on').dataset.t;
  const slots=[]; let desc='';
  if(state.availMulti){
    const e=state.availRangeEnd||state.availRangeStart;
    let d=parseYMD(state.availRangeStart), end=parseYMD(e);
    while(d<=end){const date=ymd(d); for(const m of profMinSlots(d.getDay())) slots.push({date,h:Math.floor(m/60),half:(m%60)===30?1:0}); d=addDays(d,1);}
    desc=fmtRange(state.availRangeStart,e)+' (horario del profesor)';
  } else {
    const date=state.availDate, from=+document.getElementById('aFrom').value, to=+document.getElementById('aTo').value, dow=parseYMD(date).getDay();
    for(let m=from;m<to;m+=30){const h=Math.floor(m/60),half=(m%60)===30?1:0; if(isProfHalf(dow,h,half)) slots.push({date,h,half});}
    desc=`${fmtRange(date,date)} · ${timeMin(from)}–${timeMin(to)}`;
  }
  if(!slots.length){ toast('No hay horas del profesor en ese rango','warn'); return; }
  const have=new Set(released.map(r=>r.date+'|'+r.h+'|'+r.half));
  const rows=slots.filter(s=>!have.has(s.date+'|'+s.h+'|'+s.half)).map(s=>{
    const startISO=DB.toISO(s.date,s.h,s.half*30);
    return {starts_at:startISO, ends_at:new Date(new Date(startISO).getTime()+30*60000).toISOString(), type:t};
  });
  try{
    await DB.Admin.createReleases(rows);
    if(rows.length) await DB.Admin.notifyRelease(t, desc);      // avisar a los residentes
    await loadData(); render();
    toast(rows.length?`Disponibilidad abierta (${rows.length} ${rows.length===1?'media hora':'medias horas'}) · se avisó a los residentes`:'Esas horas ya estaban abiertas');
  }catch(e){ toast(e.message,'warn'); }
}
async function doMarkAbsence(){
  let days=[], fromMin=null, toMin=null;
  if(state.availMulti){
    const e=state.availRangeEnd||state.availRangeStart;
    let d=parseYMD(state.availRangeStart), end=parseYMD(e);
    while(d<=end){ days.push(ymd(d)); d=addDays(d,1); }
  } else {
    days.push(state.availDate);
    fromMin=+document.getElementById('aFrom').value; toMin=+document.getElementById('aTo').value;
  }
  if(!days.length){ toast('Elige el día','warn'); return; }
  try{
    for(const date of days){ await DB.markAbsence(date, state.availMulti?null:fromMin, state.availMulti?null:toMin); }
    await loadData(); render();
    toast('Ausencia marcada · esas horas quedan libres para práctica');
  }catch(e){ toast(e.message,'warn'); }
}
async function unmarkAbs(id){ try{ await DB.unmarkAbsence(id); await loadData(); render(); toast('Ausencia quitada'); }catch(e){ toast(e.message,'warn'); } }
async function unrelease(i){ try{ await DB.Admin.deleteRelease(released[i].relId); await loadData(); render(); toast('Hueco cerrado nuevamente'); }catch(e){ toast(e.message,'warn'); } }
// agrupa las medias horas liberadas contiguas (mismo día y tipo) en un solo rango
function releasedRuns(){
  const arr=released.map(r=>({date:r.date, m:r.h*60+r.half*30, type:r.type, id:r.relId}))
    .sort((a,b)=> a.date<b.date?-1 : a.date>b.date?1 : a.m-b.m);
  const runs=[];
  arr.forEach(s=>{ const last=runs[runs.length-1];
    if(last && last.date===s.date && last.type===s.type && last.endM===s.m){ last.endM=s.m+30; last.ids.push(s.id); }
    else runs.push({date:s.date, type:s.type, startM:s.m, endM:s.m+30, ids:[s.id]}); });
  return runs;
}
async function unreleaseGroup(idsStr){
  const ids=[...new Set(String(idsStr).split(',').map(Number).filter(Boolean))];
  try{ for(const id of ids) await DB.Admin.deleteRelease(id); await loadData(); render(); toast(ids.length>1?'Horario cerrado nuevamente':'Hueco cerrado nuevamente'); }
  catch(e){ toast(e.message,'warn'); }
}
async function doClose(){
  const reason=document.getElementById('cReason').value||'Mantenimiento';
  let startISO,endISO,desc;
  if(state.maintMulti){
    const s=state.maintRangeStart, e=state.maintRangeEnd||state.maintRangeStart;
    startISO=DB.toISO(s,0,0); endISO=DB.toISO(ymd(addDays(parseYMD(e),1)),0,0);
    desc=`${fmtRange(s,e)} (todo el día)`;
  } else {
    const date=state.maintDate, from=+document.getElementById('cFrom').value, to=+document.getElementById('cTo').value;
    startISO=DB.toISO(date,from,0); endISO=DB.toISO(date,to,0);
    desc=`${fmtRange(date,date)} · ${hlabel(from)}–${hlabel(to)}`;
  }
  try{
    await DB.Admin.clearReservationsInRange(startISO,endISO);   // cancela las reservas afectadas
    await DB.Admin.createClosure(startISO,endISO,reason,'maintenance');
    await loadData(); render();
    toast('Cancha cerrada · '+desc);
  }catch(e){ toast(e.message,'warn'); }
}
// iOS a veces deja la barra inferior fija "flotando" a media pantalla después de cerrar un modal
// (con la página bajada) o al cambiar el alto visible. Sacarla y volverla a poner la re-ancla abajo.
// No se usa transform en .tabbar: rompe el área táctil en iOS (ver CSS de .tabbar).
function reanchorTabbar(){
  const tb=document.getElementById('tabbar');
  if(!tb || tb.style.display==='none') return;
  tb.style.display='none'; void tb.offsetHeight; tb.style.display='';
}
if(window.visualViewport) window.visualViewport.addEventListener('resize', reanchorTabbar);
function closeModal(){
  const bg=document.getElementById('modalBg'), m=document.getElementById('modal');
  if(!bg || !bg.classList.contains('show')) return;
  const isFb = m && m.classList.contains('fb'), isPop = m && m.classList.contains('pop');
  let done=false, a1=null, a2=null;
  const finish=()=>{ if(done) return; done=true;
    try{ a1&&a1.cancel(); a2&&a2.cancel(); }catch(_){}
    bg.classList.remove('show','center'); if(m){ m.classList.remove('fb','pop'); m.style.transform=''; m.style.opacity=''; } bg.style.opacity='';
    reanchorTabbar();
    if(state.liveStale){ state.liveStale=false; scheduleLive(); } };   // llegó un cambio en vivo mientras estaba abierto
  if(!m || !m.animate){ finish(); return; }                 // respaldo sin Web Animations
  try{
    a1=m.animate([{transform:'none',opacity:1},{transform:isPop?'scale(.94)':isFb?'translateY(72px) scale(.965)':'translateY(56px)',opacity:0}],
      {duration:isPop?220:270, easing:'cubic-bezier(.4,0,.75,.3)', fill:'forwards'});
    a2=bg.animate([{opacity:1},{opacity:0}], {duration:270, easing:'ease', fill:'forwards'});
    a1.onfinish=finish;
    setTimeout(finish, 330);                                // respaldo por si onfinish no dispara
  }catch(e){ finish(); }
}

/* helpers */
function emptyState(msg){return `<div class="panel"><div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg><div>${msg}</div></div></div>`}
function emptyInline(msg){return `<div class="empty" style="padding:30px">${msg}</div>`}
function weekRangeText(){const a=state.weekStart,b=addDays(a,6);
  const M=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return a.getMonth()===b.getMonth()?`${a.getDate()} al ${b.getDate()} de ${M[b.getMonth()]}`:`${a.getDate()} de ${M[a.getMonth()]} al ${b.getDate()} de ${M[b.getMonth()]}`;}
function toast(msg,type){const t=document.getElementById('toast');
  const warn=type==='warn';
  const icon=warn?'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>':'<path d="M20 6L9 17l-5-5"/>';
  t.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icon}</svg>${msg}`;
  t.classList.toggle('warn',warn);
  t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),2600);}

/* reloj en vivo: actualiza la hora y la posición de la línea cada segundo */
setInterval(tickClock,1000);
/* recargar datos cada minuto y al volver a la app (para ver reservas nuevas) */
setInterval(refreshData, 60000);
/* Auto-actualización al volver a la app (PWA): compara la VERSIÓN publicada con la
   que está corriendo; si hay una nueva, recarga sola (sin tener que cerrar sesión).
   Así no depende del tiempo que estuvo cerrada ni del caché. */
let _hiddenAt=null, _lastVerCheck=0, _verChecking=false;
async function checkVersion(){
  const now=Date.now(); if(_verChecking || now-_lastVerCheck<15000) return; _verChecking=true; _lastVerCheck=now;
  try{
    const res=await fetch('index.html?_v='+now, {cache:'no-store'});   // sin caché: trae la versión real publicada
    if(res && res.ok){ const t=await res.text(); const mm=t.match(/APP_VERSION\s*=\s*'([^']+)'/);
      if(mm && mm[1] && mm[1]!==APP_VERSION){ location.reload(); return; } }
  }catch(e){}
  _verChecking=false;
}
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ _hiddenAt=Date.now(); return; }
  _hiddenAt=null;
  if(!window.__recovery) checkVersion();   // ¿versión nueva? -> recarga sola
  refreshData();                           // datos frescos
});
window.addEventListener('focus', ()=>{ if(!window.__recovery) checkVersion(); refreshData(); });
setInterval(()=>{ if(!document.hidden && !window.__recovery) checkVersion(); }, 120000);   // por si queda abierta horas
/* al cargar la página: si hay sesión, entrar directo (no re-login al refrescar) */
if(window.DB) autoBoot(); else showLogin();
/* respaldo: si en 8 s seguimos en el splash (red lenta), mostrar el login */
setTimeout(()=>{ const s=document.getElementById('splash');
  if(s && s.style.display!=='none' && !document.getElementById('app').classList.contains('show')) showLogin();
}, 8000);
</script>
